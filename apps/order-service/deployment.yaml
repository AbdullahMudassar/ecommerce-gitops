apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: order-service:v1

          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-secrets

          ports:
            - containerPort: 8080
